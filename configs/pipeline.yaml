version: 1

# All relative paths below are resolved from the project root.
experiment:
  random_seed: 42
  device: cuda:0
  output_root: null
  # combined preserves the existing main.py behavior.
  # Method-specific main files override this automatically.
  pose_path: combined

data:
  dataset_root: datasets
  split: test
  object_id: 8
  object_name: driller
  mask_type: mask_visib
  reference:
    scene_id: 8
    image_id: 0
    instance_index: 0
  query:
    scene_id: 8
    # Use image_id or image_ids, never both.
    image_id: 1
    image_ids: null
    instance_index: 0

sam3:
  repository: sam3
  checkpoint: sam3/weights/sam3.pt
  bpe: sam3/sam3/assets/bpe_simple_vocab_16e6.txt.gz
  prompt: power drill
  # null inherits experiment.device.
  device: cuda
  use_amp: true
  confidence_threshold: 0.30

instantmesh:
  repository: InstantMesh
  python: auto
  config: configs/instantmesh_16gb/instant-mesh-large.yaml
  offline: false
  diffusion_steps: 75
  view_count: 6
  model_scale: 1.0
  render_distance: 4.5
  use_rembg: true
  export_texture_map: false
  save_video: false

dinov3:
  enabled: true
  repository: dinov3
  checkpoint: dinov3/weights/dinov3-vitl16-pretrain-lvd1689m
  model: dinov3_vitl16
  target_long_side: 448
  use_amp: true
  save_dtype: float16
  maximum_surface_points: 50000
  feature_chunk_size: 8192

foundationpose:
  repository: FoundationPose
  top_k: 3
  refine_iterations: 5
  workers: 2
  debug: 0
  renderer:
    batch_size: 3
    maximum_texture_size: 1024

# Independent mesh-to-mesh path after both self alignments.
# Its result is saved separately and does not replace Cross.
bufferx:
  enabled: true
  repository: BUFFER-X
  python: auto
  pose_estimator: ransac
  sample_count: 30000
  icp_refine: true

scale:
  normalization:
    quantile_low: 0.01
    quantile_high: 0.99
    sample_count: 100000
    random_seed: 0
    tolerance: 0.00001
  depth:
    quantile_low: 0.05
    quantile_high: 0.95
    multipliers: [0.8, 1.0, 1.25, 1.5, 1.8]
    minimum_valid_points: 100
    maximum_points: 200000
    minimum_depth_m: 0.0
    maximum_depth_m: null
    save_point_cloud: false
  visible_refinement:
    enabled: true
    reference_enabled: false
    query_enabled: true
    minimum_loss_improvement_ratio: 0.01

alignment:
  weights:
    mask: 0.30
    depth: 0.40
    free_space: 0.20
    boundary: 0.10
  depth_trim_quantile: 0.90
  minimum_depth_overlap_pixels: 50
  free_space_absolute_tolerance_m: 0.005
  free_space_relative_tolerance: 0.02
  dino:
    depth_absolute_tolerance_m: 0.005
    depth_relative_tolerance: 0.02
    minimum_matched_points: 50
    minimum_coverage: 0.05
    coverage_weight: 0.25

consistency:
  weights:
    rotation: 1.0
    translation: 1.0
    scale: 0.25
  rotation_threshold_deg: 15.0
  translation_threshold_ratio: 0.10
  maximum_scale_log_difference: null
  translation_normalizer_m: null

selection:
  candidate_weights:
    self_alignment: 0.20
    cross_alignment: 0.60
    dino: 0.20
  pair_weights:
    path_evidence: 0.75
    consistency: 0.25
